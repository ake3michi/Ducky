name: Android CI

# Antes cualquier cambio se validaba solo compilando a mano en Android
# Studio. Ahora cada push/PR se valida solo: compila, corre lint y los
# tests unitarios (StateDetector, MemoryManager).
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cachear dependencias de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x gradlew

      - name: Compilar (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Tests unitarios
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Subir reporte de lint (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

      - name: Subir resultados de tests (si falla)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
